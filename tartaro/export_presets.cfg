[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="art/*/meta.json"
exclude_filter="tools/*, README.md"
export_path="build/ios/Tartaro.ipa"

[preset.0.options]

application/app_store_team_id="SIMTEST000"
application/bundle_identifier="com.bruno.tartaro"
application/signature=""
application/short_version="1.0"
application/version="1"
application/export_project_only=true
application/min_ios_version="15.0"
capabilities/access_wifi=false
user_data/accessible_from_files_app=false

[preset.1]

name="Web"
platform="Web"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="art/*/meta.json"
exclude_filter="tools/*, README.md"
export_path="build/web/index.html"

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0.055, 0.035, 0.07, 1)
